# Runs the testing-new branch's live ozone forecaster once a day and commits
# its record back to THAT branch. It lives on main only because GitHub fires
# `schedule` triggers from the default branch; it reads and writes nothing on
# main. See testing_new/PREREGISTRATION.md on the testing-new branch.
name: testing-new-live

on:
  schedule:
    # Three tries a day; the job skips a day it has already forecast, so extras are free.
    # GitHub often starts scheduled runs hours late, and live.py refuses to forecast after
    # 12:00 LST, so one start time alone can lose a day. Earliest useful: 12:00 UTC, when
    # yesterday's last 8-hour ozone average is complete.
    #
    # In practice GitHub has started these 4.5-8.5 h late, so many days started after the
    # cutoff and were lost. The two early crons below are the fix: started late (the usual
    # case) they land mid-morning LST; started on time, the `wait` job holds them until
    # 13:05 UTC (07:05 LST), so features are never built from an incomplete day (D2).
    - cron: "15 7 * * *"       # 01:15 CST, waits up to 5h50
    - cron: "15 8 * * *"       # 02:15 CST, waits up to 4h50
    - cron: "10 12 * * *"      # 06:10 CST
    - cron: "30 13 * * *"      # 07:30 CST
    - cron: "10 14 * * *"      # 08:10 CST
  workflow_dispatch:

permissions:
  contents: write
  actions: write        # lets the cutoff step disable this workflow

jobs:
  wait:
    # Outside the concurrency group, so a sleeping early run never queues or cancels others.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Stop after the final collection cutoff
        # Live collection is final: data through 2026-11-22; runs continue to 2026-11-24 only so the
        # last forecasts get verified (final scores use issue dates <= 11-22). The first scheduled run
        # after 2026-11-24 disables this workflow and cancels itself.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $(date -u +%F) > 2026-11-24 ]]; then
            gh workflow disable "$GITHUB_WORKFLOW" -R "$GITHUB_REPOSITORY"
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"; sleep 120; exit 1
          fi

      - name: Wait until 13:05 UTC (07:05 LST)
        run: |
          now=$(date -u +%s); target=$(date -u -d "today 13:05" +%s)
          if [ "$now" -lt "$target" ]; then echo "sleeping $(( (target-now)/60 )) min"; sleep $(( target-now )); fi

  forecast:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: testing-new-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-new

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install --quiet -r requirements.txt

      - name: Forecast, verify, score
        run: python -m ozonedrift.live

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testing_new/live_forecasts.csv testing_new/live_features.csv testing_new/live_score.json
          if git diff --cached --quiet; then
            echo "Nothing new today."
            exit 0
          fi
          git commit -m "testing-new: live ozone forecasts $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin testing-new && git push origin HEAD:testing-new && exit 0
            sleep 5
          done
          exit 1
