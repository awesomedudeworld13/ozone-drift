name: report

# Rebuilds every number in RESULTS.md from the EPA annual files.
#
# Manual and monthly rather than per-push: it downloads ~150 MB of AQS data and
# trains four forests per feature tier. Nothing about this domain changes
# hourly -- EPA publishes annually and lags about six months -- so a monthly
# rebuild is as fresh as the source allows.

on:
  schedule:
    - cron: "30 8 1 * *"          # 1st of each month
  workflow_dispatch:
    inputs:
      resamples:
        description: "Bootstrap resamples"
        required: false
        default: "1000"

permissions:
  contents: write

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install --quiet -r requirements.txt

      - name: Cache AQS annual files
        uses: actions/cache@v4
        with:
          path: data/cache
          key: aqs-v1

      - name: Invariant checks
        run: python tests/test_protocol.py

      - name: Fetch
        run: python -m ozonedrift.cli fetch

      - name: Survey
        run: python -m ozonedrift.cli survey

      - name: Report
        run: |
          python -m ozonedrift.cli report \
            --resamples "${{ github.event.inputs.resamples || '1000' }}"

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESULTS.md results
          if git diff --cached --quiet; then
            echo "Results unchanged."
            exit 0
          fi
          git commit -m "results: rebuild $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1
